name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy uses a matching desktop Python to install Telethon into the APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TgBackup.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TgBackup-apk
          path: TgBackup.apk

      # Publishes a Release so you can download the APK straight from your phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TgBackup build ${{ github.run_number }}
          body: Download **TgBackup.apk** below and open it on your phone to install/update.
          files: TgBackup.apk
          make_latest: true
